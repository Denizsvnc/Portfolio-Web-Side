# Ubuntu Sunucu Nginx Şablonu (Örnek)
# Bu dosyayı /etc/nginx/sites-available/denizsevinc.com.tr içerisindeki
# mevcut konfigürasyonunuz ile değiştirebilir/birleştirebilirsiniz.
# LÜTFEN DİKKAT: Eğer Let's Encrypt (Certbot) kullanıyorsanız, 
# 'listen 443 ssl' ve 'ssl_certificate' satırlarını silmeyin, 
# yalnızca 'location' bloklarını (aşağıdaki gibi) güncelleyin.

server {
    # Eğer HTTPS varsa burası 443 ssl vb. olacaktır. Sunucudaki mevcut ayarı koruyun.
    listen 80;
    server_name denizsevinc.com.tr www.denizsevinc.com.tr;

    # Nginx için log dosyalarının konumu (isteğe bağlı)
    access_log /var/log/nginx/denizsevinc.access.log;
    error_log /var/log/nginx/denizsevinc.error.log;

    # 1. API (Backend) Yönlendirmesi
    # Gelen tüm /api/* istekleri backend servisine (3005) yönlendirilir
    location /api/ {
        proxy_pass http://127.0.0.1:3005/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Gerçek IP adreslerini backend'e taşımak için (Rate limit vs. için önemlidir)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Uploads (Yüklenen Resimler/Dosyalar) Yönlendirmesi
    # Backend'in "uploads" klasöründen statik dosyaları okur
    location /uploads/ {
        proxy_pass http://127.0.0.1:3005/uploads/;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. Frontend (Next.js) Yönlendirmesi
    # Diğer tüm trafik Next.js sunucusuna (3000) yönlendirilir
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
